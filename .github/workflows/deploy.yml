# 推到 master（Git Flow 的發佈分支）時建置並部署到 GitHub Pages。
# repo 要先把 Settings → Pages → Source 設成「GitHub Actions」。
name: 部署到 GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v5

      - name: 安裝 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 型別檢查並建置
        run: |
          # repo 有設定 Actions 變數 CONTACT_EMAIL 時用它當聯絡信箱，沒設定就用 .env 的預設值
          if [ -n "$CONTACT_EMAIL" ]; then export VITE_CONTACT_EMAIL="$CONTACT_EMAIL"; fi
          npm run build
        env:
          # og:url、分享圖與結構化資料使用這個 repo 的 Pages 網址
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # 在 Settings → Secrets and variables → Actions → Variables 設定
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳建置結果
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
